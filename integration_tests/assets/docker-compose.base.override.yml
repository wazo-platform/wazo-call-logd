services:
  call-logd:
    volumes:
      - "./etc/wazo-call-logd/conf.d/60-metrics.yml:/etc/wazo-call-logd/conf.d/60-metrics.yml"
  sync:
    depends_on:
      - auth
      - call-logd
      - cel-postgres
      - confd
      - postgres
      - rabbitmq
      - smtp
    environment:
      TARGETS: "cel-postgres:5432 postgres:5432 rabbitmq:5672 call-logd:9298 confd:9486 auth:9497 smtp:25"
